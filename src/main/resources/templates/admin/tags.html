<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head('Управление категориями — ProjectCars')}"></head>
<body>
<nav th:replace="~{fragments::navbar}"></nav>
<div class="container mt-4">
    <h2><i class="bi bi-list-check me-2"></i>Наполнение категорий</h2>
    <p class="admin-page-lead">Выберите категорию и добавляйте модификации, которые будут доступны в объявлениях.</p>
    <div class="admin-actions mb-3">
        <a th:href="@{/admin}" class="btn btn-sm btn-outline-secondary">&larr; Назад</a>
        <a th:href="@{/admin/mods}" class="btn btn-sm btn-outline-light">Категории</a>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="admin-panel mb-4">
                <div class="card-body">
                    <h5>Новая категория</h5>
                    <form th:action="@{/admin/tags}" method="post">
                        <div class="mb-2">
                            <select name="tagId" class="form-select" required>
                                <option th:each="t : ${tags}" th:value="${t.id}" th:text="${t.name}">Категория</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <input type="text" name="name" class="form-control" placeholder="Название модификации" required maxlength="100">
                        </div>
                        <button type="submit" class="btn-racing">Добавить модификацию</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <h5>Существующие категории</h5>
            <div th:each="t : ${tags}" class="admin-panel mb-3">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong th:text="${t.name}">Tag</strong>
                    <form th:action="@{/admin/tags/{id}/delete(id=${t.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Удалить категорию?')">Удалить</button>
                    </form>
                </div>
                <div class="card-body">
                    <p class="text-muted small" th:if="${t.description}" th:text="${t.description}">Описание</p>
                    <ul class="list-unstyled mb-0" th:if="${t.modsCategories}">
                        <li th:each="m : ${t.modsCategories}" class="d-flex justify-content-between align-items-center py-1 border-bottom border-secondary">
                            <span th:text="${m.name}">Mod</span>
                            <form th:action="@{/admin/mods/{id}/delete(id=${m.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-outline-danger py-0">x</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments::footer}"></div>
</body>
</html>
