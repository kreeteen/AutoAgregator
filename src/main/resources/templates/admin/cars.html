<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head('Управление объявлениями — ProjectCars')}"></head>
<body>
<nav th:replace="~{fragments::navbar}"></nav>
<div class="container mt-4">
    <h2><i class="bi bi-car-front me-2"></i>Управление объявлениями</h2>
    <a th:href="@{/admin}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Назад</a>
    <div class="table-responsive">
        <table class="table table-dark table-hover admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Пользователь</th>
                    <th>Цена</th>
                    <th>Год</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${cars}">
                    <td th:text="${c.id}">1</td>
                    <td>
                        <a th:href="@{/cars/{id}(id=${c.id})}" th:text="${c.carBrand != null ? c.carBrand.name + ' ' + c.carModel.name : 'Без бренда'}">Toyota Supra</a>
                    </td>
                    <td th:text="${c.user != null ? c.user.email : '—'}">user@test.ru</td>
                    <td th:text="${c.price != null ? #numbers.formatDecimal(c.price, 0, 'COMMA', 0, 'POINT') + ' ₽' : '—'}">1 000 000 ₽</td>
                    <td th:text="${c.manufactureYear}">1998</td>
                    <td>
                        <span th:if="${c.registered}" class="badge bg-success">На учёте</span>
                        <span th:unless="${c.registered}" class="badge bg-warning text-dark">Не на учёте</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/cars/{id}/delete(id=${c.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Удалить объявление?')">Удалить</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="~{fragments::footer}"></div>
</body>
</html>
