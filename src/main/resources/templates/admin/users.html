<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head('Управление пользователями — ProjectCars')}"></head>
<body>
<nav th:replace="~{fragments::navbar}"></nav>
<div class="container mt-4">
    <h2><i class="bi bi-people me-2"></i>Управление пользователями</h2>
    <a th:href="@{/admin}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Назад</a>
    <div class="table-responsive">
        <table class="table table-dark table-hover admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Имя</th>
                    <th>Телефон</th>
                    <th>Роли</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.email}">user@test.ru</td>
                    <td th:text="${u.lastName != null} ? ${u.firstName + ' ' + u.lastName} : ${u.firstName}">User</td>
                    <td th:text="${u.phoneNumber}">+7 999 000-00-00</td>
                    <td>
                        <form th:action="@{/admin/users/{id}/roles(id=${u.id})}" method="post" class="d-flex gap-1 flex-wrap align-items-center">
                            <div th:each="r : ${roles}">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox"
                                           th:id="'role-'+${u.id}+'-'+${r.id}"
                                           th:value="${r.name}"
                                           th:checked="${u.roles != null and u.roles.contains(r)}"
                                           name="roles"/>
                                    <label class="form-check-label small"
                                           th:for="'role-'+${u.id}+'-'+${r.id}"
                                           th:text="${r.name}">USER</label>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-sm btn-outline-primary">Сохранить</button>
                        </form>
                    </td>
                    <td>
                        <span th:if="${u.active}" class="badge bg-success">Активен</span>
                        <span th:unless="${u.active}" class="badge bg-danger">Заблокирован</span>
                    </td>
                    <td>
                        <form th:if="${u.active}" th:action="@{/admin/users/{id}/ban(id=${u.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Заблокировать пользователя?')">Заблокировать</button>
                        </form>
                        <form th:unless="${u.active}" th:action="@{/admin/users/{id}/unban(id=${u.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline-success">Разблокировать</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="~{fragments::footer}"></div>
</body>
</html>
