<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head('Модификации — ProjectCars')}"></head>
<body>
<nav th:replace="~{fragments::navbar}"></nav>
<main class="container mt-4 admin-page">
    <div class="admin-page-heading">
        <div>
            <div class="eyebrow">Администрирование</div>
            <h2><i class="bi bi-tags me-2"></i>Категории объявлений</h2>
            <p>Создайте категорию, затем откройте «Наполнение» и добавьте её модификации.</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-sm btn-outline-secondary">&larr; Назад</a>
    </div>

    <section class="admin-panel mb-4">
        <h5>Новая категория</h5>
        <form th:action="@{/admin/mods}" method="post" class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label" for="name">Название</label>
                <input id="name" name="name" class="form-control" required maxlength="100" placeholder="Например, Дрифт">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="description">Описание</label>
                <input id="description" name="description" class="form-control" maxlength="500" placeholder="Короткое описание категории">
            </div>
            <div class="col-md-2">
                <button class="btn-racing w-100" type="submit">Добавить</button>
            </div>
        </form>
    </section>

    <div class="row g-3">
        <div class="col-md-6 col-xl-4" th:each="t : ${tags}">
            <section class="admin-panel h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0" th:text="${t.name}">Категория</h5>
                    <span class="admin-count" th:text="${#lists.size(t.modsCategories)}">0</span>
                </div>
                <p class="admin-empty" th:text="${t.description != null and !t.description.isBlank() ? t.description : 'Категория готова к наполнению.'}">Описание</p>
                <a th:href="@{/admin/tags(tagId=${t.id})}" class="btn btn-sm btn-outline-light">Открыть наполнение</a>
            </section>
        </div>
    </div>
</main>
<div th:replace="~{fragments::footer}"></div>
</body>
</html>
