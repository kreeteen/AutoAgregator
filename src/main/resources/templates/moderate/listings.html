<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head('Модерация объявлений — ProjectCars')}"></head>
<body>
<nav th:replace="~{fragments::navbar}"></nav>
<main class="container mt-4 admin-page">
    <div class="admin-page-heading">
        <div>
            <div class="eyebrow">Контроль площадки</div>
            <h2><i class="bi bi-shield-check me-2"></i>Модерация объявлений</h2>
            <p>Проверьте объявление перед публикацией или удалите нарушение правил.</p>
        </div>
        <span class="admin-count" th:text="${#lists.size(cars)}">0</span>
    </div>
    <div th:if="${#lists.isEmpty(cars)}" class="empty-racing">
        <div class="empty-icon"><i class="bi bi-inbox"></i></div>
        <h4>Нет объявлений для модерации</h4>
    </div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(cars)}">
        <table class="table table-dark table-hover admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Пользователь</th>
                    <th>Цена</th>
                    <th>Год</th>
                    <th>Город</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${cars}">
                    <td th:text="${c.id}">1</td>
                    <td>
                                <a th:href="@{/cars/{id}(id=${c.id})}"
                                    th:text="${c.carBrand != null ? c.carBrand.name + (c.carModel != null ? ' ' + c.carModel.name : '') : 'Без бренда'}">Car</a>
                    </td>
                    <td th:text="${c.user != null ? c.user.email : '—'}">user@test.ru</td>
                    <td th:text="${c.price != null ? #numbers.formatDecimal(c.price, 0, 'COMMA', 0, 'POINT') + ' ₽' : '—'}">1 000 000 ₽</td>
                    <td th:text="${c.manufactureYear}">1998</td>
                    <td th:text="${c.city}">Москва</td>
                    <td class="admin-actions-cell">
                        <a th:href="@{/cars/{id}(id=${c.id})}" class="btn btn-sm btn-outline-light">Открыть</a>
                        <form th:action="@{/moderate/cars/{id}/delete(id=${c.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Удалить объявление?')"><i class="bi bi-trash3 me-1"></i>Удалить</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
 </main>
<div th:replace="~{fragments::footer}"></div>
</body>
</html>
