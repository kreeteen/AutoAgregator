<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="~{fragments :: head(${car.id != null and car.carBrand != null and car.carModel != null ? 'Редактировать — ' + car.carBrand.name + ' ' + car.carModel.name : 'Новое объявление'})}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="checkered"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 style="font-weight:800;text-transform:uppercase;letter-spacing:2px;font-size:1rem;margin:0;">
            <i class="bi" th:classappend="${car.id != null} ? 'bi-pencil' : 'bi-plus-circle'"></i>
            <span th:text="${car.id != null} ? 'Редактирование' : 'Новое объявление'">New</span>
        </h4>
        <a th:href="@{/cars}" class="btn-racing-outline" style="padding:0.3rem 1rem;font-size:0.75rem;"><i class="bi bi-x-lg me-1"></i>Отмена</a>
    </div>

    <div th:if="${validationErrors != null and !#lists.isEmpty(validationErrors)}" class="alert alert-racing alert-danger mb-4">
        <ul class="mb-0"><li th:each="e : ${validationErrors}" th:text="${e}">err</li></ul>
    </div>
    <div th:if="${validationWarnings != null and !#lists.isEmpty(validationWarnings)}" class="alert alert-racing alert-warning mb-4">
        <ul class="mb-0"><li th:each="w : ${validationWarnings}" th:text="${w}">warn</li></ul>
    </div>

    <form th:action="${car.id != null} ? @{/cars/{id}(id=${car.id})} : @{/cars}" th:object="${car}" method="post" class="form-racing needs-validation" novalidate enctype="multipart/form-data">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <input type="hidden" name="redirect" th:value="${redirect}" th:if="${redirect != null}">

        <div class="wizard-racing mb-4">
            <div class="step active">1. Основное</div>
            <div class="step">2. Характеристики</div>
            <div class="step">3. Модификации</div>
            <div class="step">4. Фото</div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <!-- Main -->
                <div class="card-racing mb-4">
                    <div class="card-body" style="padding:1.5rem;">
                        <h5 style="font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:0.85rem;color:var(--text-secondary);margin-bottom:1rem;">Основное</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Марка *</label>
                                <select name="brandId" id="brandSelect" class="form-select" required>
                                    <option value="">-- Выберите --</option>
                                    <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}" th:selected="${car.carBrand != null and car.carBrand.id == b.id}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Модель *</label>
                                <select name="modelId" id="modelSelect" class="form-select">
                                    <option value="">-- Выберите --</option>
                                    <option th:each="m : ${models ?: {}}" th:value="${m.id}" th:text="${m.name}" th:selected="${car.carModel != null and car.carModel.id == m.id}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Поколение</label>
                                <select name="genId" id="generationSelect" class="form-select">
                                    <option value="">-- Не выбрано --</option>
                                    <option th:each="g : ${generations ?: {}}" th:value="${g.id}" th:text="${g.name}" th:selected="${car.carGeneration != null and car.carGeneration.id == g.id}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Год *</label>
                                <input type="number" th:field="*{manufactureYear}" class="form-control" min="1950" max="2030" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Цена, руб *</label>
                                <input type="number" th:field="*{price}" class="form-control" step="100000" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Город *</label>
                                <input type="text" th:field="*{city}" id="cityField" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Регион</label>
                                <select name="regionId" id="regionSelect" class="form-select" onchange="fillCity()">
                                    <option value="">-- Выберите --</option>
                                    <option th:each="r : ${regions}" th:value="${r.id}" th:text="${r.name}" th:attr="data-city=${r.mainCity}" th:selected="${car.region != null and car.region.id == r.id}"></option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Направление *</label>
                                <select name="tagId" id="tagSelect" class="form-select" required onchange="toggleMods()">
                                    <option value="">-- Выберите --</option>
                                    <option th:each="t : ${tags}" th:value="${t.id}" th:text="${t.name}" th:selected="${car.projectTag != null and car.projectTag.id == t.id}"></option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Описание</label>
                                <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tech Specs -->
                <div class="card-racing mb-4">
                    <div class="card-body" style="padding:1.5rem;">
                        <h5 style="font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:0.85rem;color:var(--text-secondary);margin-bottom:1rem;">Характеристики</h5>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Тип двигателя *</label>
                                <select th:field="*{engineType}" class="form-select" required>
                                    <option value="">-- Не выбрано --</option>
                                    <option value="Бензин">Бензин</option>
                                    <option value="Дизель">Дизель</option>
                                    <option value="Гибрид">Гибрид</option>
                                    <option value="Электро">Электро</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Объём, л *</label>
                                <select th:field="*{engineDisplacement}" class="form-select" required>
                                    <option value="">-- Выберите --</option>
                                    <option th:each="v : ${engineDisplacementOptions}" th:value="${v}" th:text="${v}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Мощность, л.с. *</label>
                                <select th:field="*{enginePower}" class="form-select" required>
                                    <option value="">-- Выберите --</option>
                                    <option th:each="v : ${powerOptions}" th:value="${v}" th:text="${v}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Пробег, км</label>
                                <input type="number" th:field="*{mileageKm}" class="form-control" min="0" placeholder="Км">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Моточасы</label>
                                <input type="number" th:field="*{mileageHours}" class="form-control" min="0" placeholder="Моточасы">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Тип кузова *</label>
                                <select th:field="*{bodyType}" class="form-select" required>
                                    <option value="">-- Не выбрано --</option>
                                    <option th:each="bt : ${bodyTypes}" th:value="${bt}" th:text="${bt}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Руль *</label>
                                <select th:field="*{steeringSide}" class="form-select" required>
                                    <option value="">-- Не выбрано --</option>
                                    <option value="Левый">Левый</option>
                                    <option value="Правый">Правый</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Состояние *</label>
                                <select th:field="*{damaged}" class="form-select" required>
                                    <option value="false">Не битый</option>
                                    <option value="true">Битый</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Учёт *</label>
                                <select th:field="*{registered}" class="form-select" required>
                                    <option value="true">На учёте</option>
                                    <option value="false">Снят с учёта</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <!-- Mods -->
                <div class="card-racing mb-4">
                    <div class="card-body" style="padding:1.5rem;">
                        <h5 style="font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:0.85rem;color:var(--text-secondary);margin-bottom:1rem;">Модификации</h5>
                        <div id="modsContainer">
                            <div th:each="t : ${tags}" th:attr="data-tag-id=${t.id}" class="tag-mods" style="display:none;">
                                <div th:each="m : ${modsByTag[t.id]}" class="form-check mb-2">
                                    <input type="checkbox" th:id="'mod_' + ${m.id}" name="modIds" th:value="${m.id}" class="form-check-input"
                                           th:checked="${car.selectedMods != null and car.selectedMods.contains(m)}">
                                    <label th:for="'mod_' + ${m.id}" class="form-check-label small" style="color:var(--text-secondary);" th:text="${m.name}">mod</label>
                                </div>
                            </div>
                            <div class="small" style="color:var(--text-muted);" id="modsPlaceholder">Сначала выберите направление</div>
                        </div>
                    </div>
                </div>

                <!-- Photos -->
                <div class="card-racing mb-4">
                    <div class="card-body" style="padding:1.5rem;">
                        <h5 style="font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:0.85rem;color:var(--text-secondary);margin-bottom:1rem;">Фото *</h5>
                        <div th:if="${!#lists.isEmpty(car.images)}" class="d-flex flex-wrap gap-2 mb-3">
                            <div th:each="img : ${car.images}" style="width:80px;height:80px;border:1px solid var(--border-color);overflow:hidden;">
                                <img th:src="${img.filePath}" style="width:100%;height:100%;object-fit:cover;" alt="">
                            </div>
                        </div>
                        <div class="dropzone-racing" id="dropzone" onclick="document.getElementById('fileInput').click()">
                            <div class="dz-icon">📸</div>
                            <p><strong>Нажмите или перетащите</strong></p>
                            <p class="small" style="font-size:0.7rem;">JPG, PNG, WEBP</p>
                        </div>
                        <input type="file" name="images" id="fileInput" class="d-none" accept="image/*" multiple onchange="previewImages(event)">
                        <div id="imagePreview" class="d-flex flex-wrap gap-2 mt-2"></div>
                        <div class="form-text mt-2">Минимум 1 фото. Первое — обложка.</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn-racing" style="padding:0.6rem 3rem;font-size:1rem;">
                <i class="bi bi-check-lg me-2"></i>
                <span th:text="${car.id != null} ? 'Сохранить' : 'Опубликовать'"></span>
            </button>
        </div>
    </form>
</div>

<footer th:replace="~{fragments :: footer}"></footer>

<script>
    var modelCache = {};
    var genCache = {};
    function loadModels(brandId) {
        var modelSel = document.getElementById('modelSelect');
        var genSel = document.getElementById('generationSelect');
        modelSel.innerHTML = '<option value="">-- Загрузка... --</option>';
        genSel.innerHTML = '<option value="">-- Не выбрано --</option>';
        if (!brandId) { modelSel.innerHTML = '<option value="">-- Выберите модель --</option>'; return; }
        if (modelCache[brandId]) { renderModels(modelSel, modelCache[brandId]); return; }
        fetch('/cars/api/models?brandId=' + brandId)
            .then(function(r) { return r.json(); })
            .then(function(data) { modelCache[brandId] = data; renderModels(modelSel, data); });
    }
    function renderModels(sel, data) {
        sel.innerHTML = '<option value="">-- Выберите модель --</option>';
        data.forEach(function(m) { var opt = document.createElement('option'); opt.value = m.id; opt.textContent = m.name; sel.appendChild(opt); });
    }
    function loadGenerations(modelId) {
        var genSel = document.getElementById('generationSelect');
        genSel.innerHTML = '<option value="">-- Загрузка... --</option>';
        if (!modelId) { genSel.innerHTML = '<option value="">-- Не выбрано --</option>'; return; }
        if (genCache[modelId]) { renderGenerations(genSel, genCache[modelId]); return; }
        fetch('/cars/api/generations?modelId=' + modelId)
            .then(function(r) { return r.json(); })
            .then(function(data) { genCache[modelId] = data; renderGenerations(genSel, data); });
    }
    function renderGenerations(sel, data) {
        sel.innerHTML = '<option value="">-- Не выбрано --</option>';
        data.forEach(function(g) { var opt = document.createElement('option'); opt.value = g.id; opt.textContent = g.name; sel.appendChild(opt); });
    }
    document.getElementById('brandSelect').addEventListener('change', function() {
        loadModels(this.value);
        document.querySelector('[name="modelId"]').value = '';
        document.querySelector('[name="genId"]').value = '';
    });
    document.getElementById('modelSelect').addEventListener('change', function() {
        loadGenerations(this.value);
        document.querySelector('[name="genId"]').value = '';
    });
    function toggleMods() {
        var tagSelect = document.getElementById('tagSelect');
        var tagId = tagSelect ? tagSelect.value : '';
        document.querySelectorAll('.tag-mods').forEach(function(el) {
            el.style.display = el.getAttribute('data-tag-id') === tagId ? 'block' : 'none';
        });
        document.getElementById('modsPlaceholder').style.display = tagId ? 'none' : 'block';
    }
    toggleMods();
    function fillCity() {
        var sel = document.getElementById('regionSelect');
        var opt = sel.options[sel.selectedIndex];
        if (opt && opt.dataset.city) { document.getElementById('cityField').value = opt.dataset.city; }
    }
    fillCity();
    (function() {
        var forms = document.querySelectorAll('.needs-validation');
        Array.prototype.slice.call(forms).forEach(function(form) {
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) { event.preventDefault(); event.stopPropagation(); }
                form.classList.add('was-validated');
            }, false);
        });
    })();
    var dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', function() { this.classList.remove('dragover'); });
    dropzone.addEventListener('drop', function(e) {
        e.preventDefault(); this.classList.remove('dragover');
        document.getElementById('fileInput').files = e.dataTransfer.files;
        previewImages({target: {files: e.dataTransfer.files}});
    });
    function previewImages(event) {
        var container = document.getElementById('imagePreview');
        container.innerHTML = '';
        Array.from(event.target.files).forEach(function(file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var div = document.createElement('div');
                div.style.cssText = 'width:80px;height:80px;border:1px solid var(--border-color);overflow:hidden;';
                div.innerHTML = '<img src="' + e.target.result + '" style="width:100%;height:100%;object-fit:cover;">';
                container.appendChild(div);
            };
            reader.readAsDataURL(file);
        });
    }
</script>
</body>
</html>
