<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="~{fragments :: head('Регистрация — ProjectCars Marketplace')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="checkered"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="auth-racing">
                <div class="auth-header">
                    <i class="bi bi-person-plus" style="font-size:2rem;color:var(--red);"></i>
                    <h3>Регистрация</h3>
                    <p>Создайте аккаунт</p>
                </div>
                <div th:if="${error}" class="alert alert-racing alert-danger mb-3" th:text="${error}">err</div>
                <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="form-racing needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Имя *</label>
                            <input type="text" th:field="*{firstName}" class="form-control" required placeholder="Иван">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Фамилия</label>
                            <input type="text" th:field="*{lastName}" class="form-control" placeholder="Иванов">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Email *</label>
                            <input type="email" th:field="*{email}" class="form-control" required placeholder="your@email.com">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Телефон *</label>
                            <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="+7 (999) 123-45-67" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Пароль *</label>
                            <input type="password" th:field="*{password}" class="form-control" minlength="4" required placeholder="Минимум 4 символа">
                        </div>
                    </div>
                    <button type="submit" class="btn-racing w-100" style="justify-content:center;clip-path:none;border-radius:0;padding:0.75rem;margin-top:1rem;"><i class="bi bi-person-plus me-2"></i>Зарегистрироваться</button>
                </form>
                <p class="text-center mt-4 mb-0 small" style="color:var(--text-muted);">
                    Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
                </p>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
